[project]
name = "video-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tejdeep Gardas", email = "nethatejdeep@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2024.4.9",
    "pydub>=0.25.1",
    "ffmpeg-python>=0.2.0",
    "openai-whisper>=20231117",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "deep-translator>=1.11.4",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-groq>=0.1.0",
    "langchain-mistralai>=0.1.0",
    "mistralai>=0.4.0",
    "chromadb>=0.5.0",
    "langchain-chroma>=0.1.0",
    "sentence-transformers>=3.0.0",
    "langchain-huggingface>=0.0.3",
    "huggingface-hub>=0.23.0",
    "tiktoken>=0.7.0",
    "streamlit>=1.35.0",
    "streamlit-extras>=0.4.0",
    "watchdog>=4.0.0",
    "reportlab>=4.2.0",
    "fpdf2>=2.7.9",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "requests>=2.32.0",
]

[project.scripts]
video-agent = "video_agent:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
